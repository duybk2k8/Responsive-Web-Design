<!--
EXPLICIT GRID
- Lưới tự tạo => được chỉ định trc, khai báo rõ ràng
.container {
  display: grid;
  grid-template-columns: 100px 100px;
  grid-template-rows: 100px 100px;
}
+-----+-----+
|     |     |
+-----+-----+
|     |     |
+-----+-----+ => 2 cột 2 hàng

=> nếu cho thêm phần tử:
<div class="container">
  <div>1</div>
  <div>2</div>
  <div>3</div>
  <div>4</div>
  <div>5</div>
</div>
+-----+-----+
|  1  |  2  |
+-----+-----+
|  3  |  4  |
+-----+-----+
|  5  |     |   ← tự tạo 1 hàng mới => tự sinh ra => IMPLICIT GRID
+-----+-----+

grid-auto-rows=> Khai báo khi nó tự tạo 1 hàng mới
grid-auto-columns => Khai báo khi nó tự tạo 1 cột mới
-->
<link rel="stylesheet" href="grid5_im_explicit.css">
<div class="grid-container">
  <div class="grid-item">Item 1</div>
  <div class="grid-item">Item 2</div>
  <div class="grid-item">Item 3</div>
  <div class="grid-item">Item 4</div>
  <div class="grid-item">Item 5</div>
  <div class="grid-item">Item 6</div>
</div>
